name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    # Without this a hung step runs for GitHub's six-hour default before
    # anyone finds out.
    timeout-minutes: 15

    # A real Postgres, so the migration is executed rather than merely
    # generated. `prisma migrate deploy` failing here is the signal that the
    # committed migration does not apply to an empty database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingualayer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lingualayer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile pins and fails if the two have drifted, which is what a CI
      # run wants to know.
      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Every step below used to end in `|| true`, so the job reported success
      # no matter what happened. main had been unable to compile for some time
      # and CI stayed green throughout.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Seed
        run: npm run db:seed

      - name: Test
        run: npm test
